# Overlay de desenvolvimento: sobe um Postgres local.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: galpao
      POSTGRES_PASSWORD: galpao_dev
      POSTGRES_DB: galpao
    ports:
      - "5433:5432"
    volumes:
      # aplica 001..004 em ordem na criação do volume
      - ./db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ingestor:
    environment:
      DATABASE_URL: postgresql://galpao:galpao_dev@postgres:5432/galpao
    depends_on:
      - postgres

  api:
    environment:
      DATABASE_URL_API: postgresql://galpao:galpao_dev@postgres:5432/galpao
      ROOT_PATH: ""
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
