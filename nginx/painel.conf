# Painel estático (nginx:alpine). Montado como /etc/nginx/conf.d/default.conf.
# Em produção o Traefik manda /api direto para a API; o proxy abaixo vale para o dev.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # Cabeçalhos de segurança. Os locations abaixo usam "expires" (e não add_header)
    # para o Cache-Control, senão perderiam estes cabeçalhos herdados.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # dev: /api/x -> api:8000/x (a API roda com ROOT_PATH=/api)
    location ^~ /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # este location tem seu próprio add_header, então não herda a CSP do painel:
        # ela quebraria o Swagger (/api/docs), que usa scripts de CDN
        add_header X-Content-Type-Options "nosniff" always;
    }

    # páginas: nunca em cache
    location ~* \.html$ {
        expires -1;
    }

    # sem build com hash nos nomes: cache curto
    location ~* \.(css|js)$ {
        expires 5m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
