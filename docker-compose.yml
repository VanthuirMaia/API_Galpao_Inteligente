# Base comum a dev e produção. O Postgres não entra aqui.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    logging: *logging
    restart: unless-stopped

  ingestor:
    build: ./ingestor
    env_file: .env
    depends_on:
      - mosquitto
    logging: *logging
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env
    # vivo = o app responde (o /saude devolve 200 mesmo com o banco fora; o campo "banco" mostra o estado)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
    restart: unless-stopped

  painel:
    image: nginx:alpine
    volumes:
      - ./painel:/usr/share/nginx/html:ro
      - ./nginx/painel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging: *logging
    restart: unless-stopped

volumes:
  mosquitto_data:
