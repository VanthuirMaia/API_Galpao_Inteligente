# Base comum a dev e produção. O Postgres não entra aqui.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  ingestor:
    build: ./ingestor
    env_file: .env
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
