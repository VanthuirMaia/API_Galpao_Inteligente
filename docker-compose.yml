# Base comum a dev e produção. O Postgres não entra aqui.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    logging: *logging
    restart: unless-stopped

  ingestor:
    build: ./ingestor
    env_file: .env
    depends_on:
      - mosquitto
    logging: *logging
    restart: unless-stopped

volumes:
  mosquitto_data:
